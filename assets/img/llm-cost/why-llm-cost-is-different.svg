<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 348" width="800" height="348" role="img" aria-labelledby="t1 d1" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t1">Why an LLM call is harder to attribute than a cloud resource</title>
  <desc id="d1">A traditional cloud resource such as an EC2 instance is tagged once at provisioning and lives for months, so the bill follows it. An LLM invocation is a metered event lasting seconds that leaves no resource behind, so attribution must happen at the call or not at all.</desc>
  <rect width="800" height="348" fill="#ffffff"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#1f2933">Why LLM cost is different</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7b">Everything else in your bill is attached to something that persists. An LLM call isn't.</text>

  <!-- LEFT -->
  <rect x="20" y="66" width="372" height="240" rx="10" fill="#f6f8fa" stroke="#dde4ec"/>
  <text x="40" y="95" font-size="13.5" font-weight="700" fill="#1f2933">A resource you can tag</text>

  <rect x="40" y="116" width="132" height="48" rx="8" fill="#ffffff" stroke="#cfd8e3"/>
  <text x="106" y="138" font-size="12" fill="#1f2933" text-anchor="middle">EC2 instance</text>
  <text x="106" y="152" font-size="8.5" fill="#7a8896" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">i-0a1b2c3d</text>
  <line x1="172" y1="140" x2="188" y2="140" stroke="#c4d5f7" stroke-width="1.4" stroke-dasharray="3 3"/>
  <rect x="190" y="120" width="162" height="17" rx="8.5" fill="#e7edfd" stroke="#c4d5f7"/>
  <text x="199" y="132" font-size="8.5" fill="#33507f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cost-center: CC-4410</text>
  <rect x="190" y="143" width="162" height="17" rx="8.5" fill="#e7edfd" stroke="#c4d5f7"/>
  <text x="199" y="155" font-size="8.5" fill="#33507f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">application: APP-1234</text>

  <text x="40" y="196" font-size="10" fill="#5b6b7b">Lifetime</text>
  <rect x="40" y="204" width="312" height="12" rx="6" fill="#c4d5f7"/>
  <text x="196" y="234" font-size="9.5" fill="#7a8896" text-anchor="middle">exists for months &#8212; tagged once, at provisioning</text>

  <line x1="40" y1="250" x2="372" y2="250" stroke="#e2e8f0"/>
  <text x="40" y="272" font-size="11" fill="#5b6b7b">Tag it once and forget it.</text>
  <text x="40" y="288" font-size="11" fill="#5b6b7b">The bill follows the resource for its whole life.</text>

  <!-- RIGHT -->
  <rect x="408" y="66" width="372" height="240" rx="10" fill="#f6f8fa" stroke="#dde4ec"/>
  <text x="428" y="95" font-size="13.5" font-weight="700" fill="#1f2933">An event that leaves nothing</text>

  <rect x="428" y="116" width="132" height="48" rx="8" fill="#ffffff" stroke="#cfd8e3"/>
  <text x="494" y="138" font-size="12" fill="#1f2933" text-anchor="middle">InvokeModel</text>
  <text x="494" y="152" font-size="8.5" fill="#7a8896" text-anchor="middle">1,240 in / 380 out tokens</text>
  <line x1="560" y1="140" x2="576" y2="140" stroke="#cfd8e3" stroke-width="1.4" stroke-dasharray="3 3"/>
  <rect x="578" y="120" width="162" height="17" rx="8.5" fill="#eef1f4" stroke="#cfd8e3"/>
  <text x="587" y="132" font-size="8.5" fill="#6b7887">no resource to tag</text>
  <rect x="578" y="143" width="162" height="17" rx="8.5" fill="#eef1f4" stroke="#cfd8e3"/>
  <text x="587" y="155" font-size="8.5" fill="#6b7887">nothing left afterwards</text>

  <text x="428" y="196" font-size="10" fill="#5b6b7b">Lifetime</text>
  <g fill="#98a4b3">
    <rect x="428" y="204" width="5" height="12" rx="2"/><rect x="454" y="204" width="5" height="12" rx="2"/>
    <rect x="480" y="204" width="5" height="12" rx="2"/><rect x="506" y="204" width="5" height="12" rx="2"/>
    <rect x="532" y="204" width="5" height="12" rx="2"/><rect x="558" y="204" width="5" height="12" rx="2"/>
    <rect x="584" y="204" width="5" height="12" rx="2"/><rect x="610" y="204" width="5" height="12" rx="2"/>
    <rect x="636" y="204" width="5" height="12" rx="2"/><rect x="662" y="204" width="5" height="12" rx="2"/>
    <rect x="688" y="204" width="5" height="12" rx="2"/><rect x="714" y="204" width="5" height="12" rx="2"/>
    <rect x="740" y="204" width="5" height="12" rx="2"/>
  </g>
  <text x="586" y="234" font-size="9.5" fill="#7a8896" text-anchor="middle">thousands of metered events, each gone in seconds</text>

  <line x1="428" y1="250" x2="760" y2="250" stroke="#e2e8f0"/>
  <text x="428" y="272" font-size="11" fill="#5b6b7b">The invoice sees one line: &#8220;Bedrock &#8212; $47,310&#8221;.</text>
  <text x="428" y="288" font-size="11" fill="#5b6b7b">Attribution happens at the call, or not at all.</text>
</svg>
