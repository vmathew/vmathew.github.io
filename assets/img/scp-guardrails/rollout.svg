<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 204" width="800" height="204" role="img" aria-labelledby="t4 d4" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t4">Rollout sequence</title>
  <desc id="d4">Six steps: build the guardrail catalog, write the SCP without attaching it and replay CloudTrail, ship the gateway or SDK, attach the SCP to dev OUs first, close the egress gap, then report monthly.</desc>
  <rect width="800" height="204" fill="#ffffff"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="#1f2933">Rolling it out without breaking anyone</text>
  <text x="24" y="48" font-size="12.5" fill="#5b6b7b">The order matters more than the speed: make the compliant path easy before you make the other one impossible.</text>

  <line x1="70" y1="94" x2="730" y2="94" stroke="#dde4ec" stroke-width="2"/>

  <g text-anchor="middle">
    <circle cx="70" cy="94" r="17" fill="#ffffff" stroke="#c4d5f7" stroke-width="2"/>
    <text x="70" y="99" font-size="13" font-weight="700" fill="#2563eb">1</text>
    <text x="70" y="132" font-size="10.5" font-weight="600" fill="#1f2933">Build the guardrail</text>
    <text x="70" y="146" font-size="10.5" font-weight="600" fill="#1f2933">catalog</text>
    <text x="70" y="166" font-size="9.5" fill="#7a8896">2&#8211;3 named policies,</text>
    <text x="70" y="179" font-size="9.5" fill="#7a8896">clear ownership</text>

    <circle cx="202" cy="94" r="17" fill="#ffffff" stroke="#c4d5f7" stroke-width="2"/>
    <text x="202" y="99" font-size="13" font-weight="700" fill="#2563eb">2</text>
    <text x="202" y="132" font-size="10.5" font-weight="600" fill="#1f2933">Write the SCP,</text>
    <text x="202" y="146" font-size="10.5" font-weight="600" fill="#1f2933">don't attach it yet</text>
    <text x="202" y="166" font-size="9.5" fill="#7a8896">Replay CloudTrail for</text>
    <text x="202" y="179" font-size="9.5" fill="#7a8896">would-be denies</text>

    <circle cx="334" cy="94" r="17" fill="#ffffff" stroke="#c4d5f7" stroke-width="2"/>
    <text x="334" y="99" font-size="13" font-weight="700" fill="#2563eb">3</text>
    <text x="334" y="132" font-size="10.5" font-weight="600" fill="#1f2933">Ship the gateway</text>
    <text x="334" y="146" font-size="10.5" font-weight="600" fill="#1f2933">or SDK</text>
    <text x="334" y="166" font-size="9.5" fill="#7a8896">Make it the easiest</text>
    <text x="334" y="179" font-size="9.5" fill="#7a8896">way to call a model</text>

    <circle cx="466" cy="94" r="18" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
    <text x="466" y="99" font-size="13" font-weight="700" fill="#ffffff">4</text>
    <text x="466" y="132" font-size="10.5" font-weight="700" fill="#17315e">Attach the SCP,</text>
    <text x="466" y="146" font-size="10.5" font-weight="700" fill="#17315e">dev OUs first</text>
    <text x="466" y="166" font-size="9.5" fill="#5b6b7b">Production once dev</text>
    <text x="466" y="179" font-size="9.5" fill="#5b6b7b">denies flatten</text>

    <circle cx="598" cy="94" r="17" fill="#ffffff" stroke="#c4d5f7" stroke-width="2"/>
    <text x="598" y="99" font-size="13" font-weight="700" fill="#2563eb">5</text>
    <text x="598" y="132" font-size="10.5" font-weight="600" fill="#1f2933">Close the egress</text>
    <text x="598" y="146" font-size="10.5" font-weight="600" fill="#1f2933">gap</text>
    <text x="598" y="166" font-size="9.5" fill="#7a8896">Or the strays just</text>
    <text x="598" y="179" font-size="9.5" fill="#7a8896">move elsewhere</text>

    <circle cx="730" cy="94" r="17" fill="#ffffff" stroke="#c4d5f7" stroke-width="2"/>
    <text x="730" y="99" font-size="13" font-weight="700" fill="#2563eb">6</text>
    <text x="730" y="132" font-size="10.5" font-weight="600" fill="#1f2933">Report monthly</text>
    <text x="730" y="166" font-size="9.5" fill="#7a8896">Denies, PII, cost,</text>
    <text x="730" y="179" font-size="9.5" fill="#7a8896">policy coverage</text>
  </g>
</svg>
