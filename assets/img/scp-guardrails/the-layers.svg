<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 368" width="800" height="368" role="img" aria-labelledby="t3 d3" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t3">The foundation and the rest of the building</title>
  <desc id="d3">Four layers, from the bottom: the Service Control Policy is mandatory; the gateway or SDK, egress controls, and observability can each be phased in on top of it.</desc>
  <rect width="800" height="368" fill="#ffffff"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#1f2933">The foundation and the rest of the building</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7b">Everything above the policy can be phased in. The policy itself cannot.</text>

  <rect x="24" y="68" width="752" height="56" rx="10" fill="#f8f9fa" stroke="#dde4ec"/>
  <text x="44" y="92" font-size="13" font-weight="700" fill="#1f2933">Observability</text>
  <text x="44" y="110" font-size="11" fill="#5b6b7b">Blocked calls, masked PII, cost per team &#8212; the evidence that turns a control into governance.</text>
  <rect x="668" y="86" width="88" height="20" rx="10" fill="#eef1f4" stroke="#cfd8e3"/>
  <text x="712" y="100" font-size="10" font-weight="700" fill="#5b6b7b" text-anchor="middle" letter-spacing="0.5">PHASE IN</text>

  <rect x="24" y="134" width="752" height="56" rx="10" fill="#f8f9fa" stroke="#dde4ec"/>
  <text x="44" y="158" font-size="13" font-weight="700" fill="#1f2933">Egress controls</text>
  <text x="44" y="176" font-size="11" fill="#5b6b7b">Deny outbound access to third-party model endpoints by default &#8212; the SCP does not reach them.</text>
  <rect x="668" y="152" width="88" height="20" rx="10" fill="#eef1f4" stroke="#cfd8e3"/>
  <text x="712" y="166" font-size="10" font-weight="700" fill="#5b6b7b" text-anchor="middle" letter-spacing="0.5">PHASE IN</text>

  <rect x="24" y="200" width="752" height="56" rx="10" fill="#f8f9fa" stroke="#dde4ec"/>
  <text x="44" y="224" font-size="13" font-weight="700" fill="#1f2933">Gateway or SDK</text>
  <text x="44" y="242" font-size="11" fill="#5b6b7b">Picks the right guardrail, routes to an approved model, tags and traces every call.</text>
  <rect x="668" y="218" width="88" height="20" rx="10" fill="#eef1f4" stroke="#cfd8e3"/>
  <text x="712" y="232" font-size="10" font-weight="700" fill="#5b6b7b" text-anchor="middle" letter-spacing="0.5">PHASE IN</text>

  <rect x="24" y="266" width="752" height="62" rx="10" fill="#e7edfd" stroke="#93b0f5" stroke-width="2"/>
  <text x="44" y="292" font-size="13.5" font-weight="700" fill="#17315e">Service Control Policy</text>
  <text x="44" y="311" font-size="11" fill="#33507f">Deny any model invocation without an approved guardrail and an approved model. Organization-wide.</text>
  <rect x="660" y="286" width="96" height="21" rx="10.5" fill="#ffffff" stroke="#2563eb"/>
  <text x="708" y="301" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0.5">MANDATORY</text>

  <text x="400" y="352" font-size="11" fill="#7a8896" text-anchor="middle">Build it bottom-up. Without the foundation, every layer above it is a suggestion teams can route around.</text>
</svg>
