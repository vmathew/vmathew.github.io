<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      /* Runs before any paint so a pinned theme never flashes the other one. */
      (function(){try{var t=localStorage.getItem('theme');
        if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}
      }catch(e){}}());
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/override.css' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3911008403069012"
     crossorigin="anonymous"></script>
    {% seo %}  <!-- Enables jekyll-seo-tag plugin -->
  </head>

  <body>
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav">
          <a class="page-link" href="{{ '/about/' | relative_url }}">About</a>
          <a class="page-link" href="{{ '/categories/' | relative_url }}">Categories</a>
          {% include theme-toggle.html %}
          <!-- <a href="{{ site.github.repository_url }}">GitHub</a> -->
        </nav>
      </div>
    </header>

    <main class="page-content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <p>&copy; {{ site.time | date: "%Y" }} {{ site.author }} — {{ site.title }}</p>
      </div>
    </footer>
  </body>
</html>
