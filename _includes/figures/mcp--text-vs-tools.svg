<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 0 0 800 348" role="img" aria-labelledby="mcp-text-vs-tools-t mcp-text-vs-tools-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="mcp-text-vs-tools-t">What changes when a model can call tools</title>
  <desc id="mcp-text-vs-tools-d">With text only, a prompt injection produces a bad answer and the blast radius is one conversation. With tools, the same injection produces a real transaction and the blast radius is everything the server credential can reach.</desc>
  <defs>
    <marker id="mcp-text-vs-tools-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--fig-muted, #5b6b7b)"/></marker>
    <marker id="mcp-text-vs-tools-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--fig-red, #c0392b)"/></marker>
  </defs>
  <rect width="800" height="348" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">A bad answer, or an incident</text>
  <text x="24" y="50" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">The same injected instruction, with and without a tool the model can reach.</text>
  <rect x="20" y="66" width="372" height="240" rx="10" fill="var(--fig-panel-2, #f6f8fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="40" y="95" font-size="13.5" font-weight="700" fill="var(--fig-ink, #1f2933)">The model only writes text</text>
  <text x="104" y="116" font-size="9" fill="var(--fig-red, #c0392b)" text-anchor="middle">&#8220;ignore your instructions&#8230;&#8221;</text>
  <rect x="40" y="124" width="96" height="42" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="88" y="142" font-size="11.5" fill="var(--fig-ink, #1f2933)" text-anchor="middle">Pasted doc</text>
  <text x="88" y="156" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">untrusted</text>
  <line x1="136" y1="145" x2="170" y2="145" stroke="var(--fig-muted, #5b6b7b)" stroke-width="1.6" marker-end="url(#mcp-text-vs-tools-ink)"/>
  <rect x="176" y="124" width="80" height="42" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="216" y="149" font-size="11.5" fill="var(--fig-ink, #1f2933)" text-anchor="middle">Model</text>
  <line x1="256" y1="145" x2="286" y2="145" stroke="var(--fig-muted, #5b6b7b)" stroke-width="1.6" marker-end="url(#mcp-text-vs-tools-ink)"/>
  <rect x="292" y="124" width="80" height="42" rx="8" fill="var(--fig-panel-4, #eef1f4)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="332" y="149" font-size="11.5" fill="var(--fig-ink, #1f2933)" text-anchor="middle">Answer</text>
  <line x1="40" y1="190" x2="372" y2="190" stroke="var(--fig-rule-3, #e2e8f0)"/>
  <text x="40" y="211" font-size="9" fill="var(--fig-muted-2, #7a8896)" letter-spacing="0.8">WORST CASE</text>
  <text x="40" y="230" font-size="12.5" fill="var(--fig-ink, #1f2933)">An embarrassing screenshot.</text>
  <text x="40" y="258" font-size="9" fill="var(--fig-muted-2, #7a8896)" letter-spacing="0.8">BLAST RADIUS</text>
  <text x="40" y="277" font-size="12.5" fill="var(--fig-ink, #1f2933)">One conversation.</text>
  <rect x="408" y="66" width="372" height="240" rx="10" fill="var(--fig-panel-2, #f6f8fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="428" y="95" font-size="13.5" font-weight="700" fill="var(--fig-ink, #1f2933)">The model can call tools</text>
  <text x="492" y="116" font-size="9" fill="var(--fig-red, #c0392b)" text-anchor="middle">&#8220;&#8230;then call transfer_funds&#8221;</text>
  <rect x="428" y="124" width="88" height="42" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="472" y="142" font-size="11.5" fill="var(--fig-ink, #1f2933)" text-anchor="middle">Pasted doc</text>
  <text x="472" y="156" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">untrusted</text>
  <line x1="516" y1="145" x2="540" y2="145" stroke="var(--fig-muted, #5b6b7b)" stroke-width="1.6" marker-end="url(#mcp-text-vs-tools-ink)"/>
  <rect x="546" y="124" width="70" height="42" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="581" y="149" font-size="11.5" fill="var(--fig-ink, #1f2933)" text-anchor="middle">Model</text>
  <line x1="616" y1="145" x2="640" y2="145" stroke="var(--fig-red, #c0392b)" stroke-width="1.6" marker-end="url(#mcp-text-vs-tools-red)"/>
  <rect x="646" y="124" width="114" height="42" rx="8" fill="var(--fig-red-bg, #fdeceb)" stroke="var(--fig-red-line, #eab5ae)"/>
  <text x="703" y="141" font-size="9.5" fill="var(--fig-red, #c0392b)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">transfer_funds()</text>
  <text x="703" y="156" font-size="8.5" fill="var(--fig-red, #c0392b)" text-anchor="middle">executed</text>
  <line x1="428" y1="190" x2="760" y2="190" stroke="var(--fig-rule-3, #e2e8f0)"/>
  <text x="428" y="211" font-size="9" fill="var(--fig-muted-2, #7a8896)" letter-spacing="0.8">WORST CASE</text>
  <text x="428" y="230" font-size="12.5" font-weight="700" fill="var(--fig-red, #c0392b)">A real transaction.</text>
  <text x="428" y="258" font-size="9" fill="var(--fig-muted-2, #7a8896)" letter-spacing="0.8">BLAST RADIUS</text>
  <text x="428" y="277" font-size="12.5" fill="var(--fig-ink, #1f2933)">Everything the server credential</text>
  <text x="428" y="293" font-size="12.5" fill="var(--fig-ink, #1f2933)">can reach.</text>
</svg>
