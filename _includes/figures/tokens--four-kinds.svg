<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="tokens-four-t tokens-four-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="tokens-four-t">Four kinds of repeated tokens</title>
  <desc id="tokens-four-d">A typical enterprise model call broken into four bands: the repeated prefix (system prompt, tool schemas, examples), repeated questions, repeated retrieval (documents pasted or fetched again), and repeated learning (facts the agent rediscovers). Only the last thin band is genuinely new per user.</desc>
  <rect width="800" height="360" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">What a typical enterprise call is made of</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">Proportions are illustrative. The point is the shape: most tokens on most calls have been sent before.</text>

  <!-- stacked bar -->
  <rect x="24" y="76" width="752" height="56" rx="8" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <rect x="24" y="76" width="376" height="56" rx="8" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <rect x="400" y="76" width="120" height="56" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <rect x="520" y="76" width="150" height="56" fill="var(--fig-amber-bg, #fdf3e0)" stroke="var(--fig-amber-line, #e8cc9a)"/>
  <rect x="670" y="76" width="70" height="56" fill="var(--fig-panel-3, #eef2f7)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <rect x="740" y="76" width="36" height="56" rx="8" fill="var(--fig-red-bg, #fdeceb)" stroke="var(--fig-red-line, #eab5ae)"/>

  <text x="212" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="var(--fig-blue-ink, #17315e)">Repeated prefix</text>
  <text x="212" y="118" text-anchor="middle" font-size="10.5" fill="var(--fig-blue-ink-2, #33507f)">system prompt · tool schemas · examples</text>
  <text x="460" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="var(--fig-green, #0f6f4f)">Repeated question</text>
  <text x="460" y="118" text-anchor="middle" font-size="10.5" fill="var(--fig-green-2, #0f7a56)">same ask, many users</text>
  <text x="595" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="var(--fig-amber-ink, #8a5a13)">Repeated retrieval</text>
  <text x="595" y="118" text-anchor="middle" font-size="10.5" fill="var(--fig-amber, #b7791f)">the same document, again</text>
  <text x="705" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="var(--fig-muted, #5b6b7b)">Relearned</text>
  <text x="705" y="118" text-anchor="middle" font-size="10" fill="var(--fig-muted-2, #7a8896)">facts</text>
  <text x="758" y="108" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fig-red, #c0392b)">New</text>

  <!-- legend rows -->
  <g font-size="12" fill="var(--fig-ink, #1f2933)">
    <rect x="24" y="160" width="12" height="12" rx="3" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
    <text x="44" y="171" font-weight="700">Repeated prefix</text>
    <text x="180" y="171" fill="var(--fig-muted, #5b6b7b)">Identical for every user of an application. Fix: prompt caching, with static content first.</text>

    <rect x="24" y="196" width="12" height="12" rx="3" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
    <text x="44" y="207" font-weight="700">Repeated question</text>
    <text x="180" y="207" fill="var(--fig-muted, #5b6b7b)">The FAQ-shaped slice of traffic. Fix: semantic response cache, only where the answer is not personal.</text>

    <rect x="24" y="232" width="12" height="12" rx="3" fill="var(--fig-amber-bg, #fdf3e0)" stroke="var(--fig-amber-line, #e8cc9a)"/>
    <text x="44" y="243" font-weight="700">Repeated retrieval</text>
    <text x="180" y="243" fill="var(--fig-muted, #5b6b7b)">Whole documents shipped on every call. Fix: index once, retrieve a few hundred tokens.</text>

    <rect x="24" y="268" width="12" height="12" rx="3" fill="var(--fig-panel-3, #eef2f7)" stroke="var(--fig-rule-2, #cfd8e3)"/>
    <text x="44" y="279" font-weight="700">Repeated learning</text>
    <text x="180" y="279" fill="var(--fig-muted, #5b6b7b)">Facts the agent rediscovers per user. Fix: shared memory with a governed write path.</text>

    <rect x="24" y="304" width="12" height="12" rx="3" fill="var(--fig-red-bg, #fdeceb)" stroke="var(--fig-red-line, #eab5ae)"/>
    <text x="44" y="315" font-weight="700">Genuinely new</text>
    <text x="180" y="315" fill="var(--fig-muted, #5b6b7b)">The user's actual request. The only band you should be paying full price for.</text>
  </g>
  <text x="24" y="346" font-size="10.5" fill="var(--fig-faint, #98a4b3)">Four kinds of repetition, four different mechanisms. Mixing them up is how caching projects fail.</text>
</svg>
