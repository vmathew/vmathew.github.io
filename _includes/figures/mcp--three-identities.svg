<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 336" role="img" aria-labelledby="mcp-identities-t mcp-identities-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="mcp-identities-t">Three identities in every tool call</title>
  <desc id="mcp-identities-d">The user signs in to the agent, the agent presents a user-scoped token plus its own identity to the gateway, the gateway applies policy and passes identity to the MCP server, and the server calls the downstream system as the user. All three identities — user, agent and server — must be real and visible in the audit log.</desc>
  <defs><marker id="mcp-identities-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--fig-green-2, #0f7a56)"/></marker></defs>
  <rect width="800" height="336" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">Three identities in every tool call</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">One shared service credential means every user has the server's permissions and every action is attributed to a robot.</text>
  <rect x="30" y="110" width="110" height="48" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="85" y="130" font-size="11.5" font-weight="600" fill="var(--fig-ink, #1f2933)" text-anchor="middle">User</text>
  <text x="85" y="145" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">signs in</text>
  <rect x="180" y="110" width="110" height="48" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="235" y="130" font-size="11.5" font-weight="600" fill="var(--fig-ink, #1f2933)" text-anchor="middle">Agent</text>
  <text x="235" y="145" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">registered principal</text>
  <rect x="330" y="110" width="110" height="48" rx="8" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="385" y="130" font-size="11.5" font-weight="600" fill="var(--fig-blue-ink, #17315e)" text-anchor="middle">Gateway</text>
  <text x="385" y="145" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">policy + traces</text>
  <rect x="480" y="110" width="130" height="48" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="545" y="130" font-size="11.5" font-weight="600" fill="var(--fig-ink, #1f2933)" text-anchor="middle">MCP server</text>
  <text x="545" y="145" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">least privilege</text>
  <rect x="650" y="110" width="120" height="48" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="710" y="130" font-size="11.5" font-weight="600" fill="var(--fig-ink, #1f2933)" text-anchor="middle">Downstream</text>
  <text x="710" y="145" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">system of record</text>
  <line x1="140" y1="134" x2="174" y2="134" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.6" marker-end="url(#mcp-identities-a)"/>
  <text x="157" y="100" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">signs in</text>
  <line x1="290" y1="134" x2="324" y2="134" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.6" marker-end="url(#mcp-identities-a)"/>
  <text x="307" y="100" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">user token</text>
  <line x1="440" y1="134" x2="474" y2="134" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.6" marker-end="url(#mcp-identities-a)"/>
  <text x="457" y="100" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">+ agent id</text>
  <line x1="610" y1="134" x2="644" y2="134" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.6" marker-end="url(#mcp-identities-a)"/>
  <text x="627" y="100" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">as the user</text>
  <rect x="30" y="192" width="236" height="96" rx="9" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="48" y="216" font-size="12" font-weight="700" fill="var(--fig-ink, #1f2933)">The user</text>
  <text x="48" y="238" font-size="9.5" fill="var(--fig-muted, #5b6b7b)">Their entitlements reach the server.</text>
  <text x="48" y="253" font-size="9.5" fill="var(--fig-muted, #5b6b7b)">If they can't do it directly,</text>
  <text x="48" y="268" font-size="9.5" fill="var(--fig-muted, #5b6b7b)">they can't do it via an agent.</text>
  <rect x="282" y="192" width="236" height="96" rx="9" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="300" y="216" font-size="12" font-weight="700" fill="var(--fig-ink, #1f2933)">The agent</text>
  <text x="300" y="238" font-size="9.5" fill="var(--fig-muted, #5b6b7b)">A registered principal with a</text>
  <text x="300" y="253" font-size="9.5" fill="var(--fig-muted, #5b6b7b)">version, so the log can name</text>
  <text x="300" y="268" font-size="9.5" fill="var(--fig-muted, #5b6b7b)">the claims-triage agent, v12.</text>
  <rect x="534" y="192" width="236" height="96" rx="9" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="552" y="216" font-size="12" font-weight="700" fill="var(--fig-ink, #1f2933)">The server</text>
  <text x="552" y="238" font-size="9.5" fill="var(--fig-muted, #5b6b7b)">Only the downstream permissions</text>
  <text x="552" y="253" font-size="9.5" fill="var(--fig-muted, #5b6b7b)">its tools need. Read-only tools</text>
  <text x="552" y="268" font-size="9.5" fill="var(--fig-muted, #5b6b7b)">get a read-only credential.</text>
  <text x="400" y="318" font-size="11" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">The test: can the downstream audit log name all three &#8212; and prove the user was entitled without the agent in the loop?</text>
</svg>
