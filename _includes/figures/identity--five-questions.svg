<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" width="800" height="406" role="img" aria-labelledby="identity-five-questions-t identity-five-questions-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="identity-five-questions-t">Five questions to ask about any agent before production</title>
  <desc id="identity-five-questions-d">Which identity is on the request; can the agent exceed the requesting user; can agent and user be revoked independently; where is the permission check enforced and can the model influence it; and what would the audit log show. An agent that passes all five is defensible; one that fails any is a demo.</desc>
  <rect width="800" height="406" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">Five questions before production</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">For an architect, a security partner, or an executive signing the risk acceptance. The right-hand column is the failing answer.</text>
  <rect x="24" y="86" width="752" height="40" rx="8" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="111" font-size="11" font-weight="700" fill="var(--fig-blue, #2563eb)">1</text>
  <text x="62" y="111" font-size="11.5" fill="var(--fig-ink, #1f2933)">When this agent acts, which identity is on the request?</text>
  <text x="756" y="111" font-size="10" fill="var(--fig-red, #c0392b)" text-anchor="end">A single service account &#8212; stop there</text>
  <rect x="24" y="134" width="752" height="40" rx="8" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="159" font-size="11" font-weight="700" fill="var(--fig-blue, #2563eb)">2</text>
  <text x="62" y="159" font-size="11.5" fill="var(--fig-ink, #1f2933)">Can it do anything the requesting user could not?</text>
  <text x="756" y="159" font-size="10" fill="var(--fig-red, #c0392b)" text-anchor="end">If yes: why, and who approved that?</text>
  <rect x="24" y="182" width="752" height="40" rx="8" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="207" font-size="11" font-weight="700" fill="var(--fig-blue, #2563eb)">3</text>
  <text x="62" y="207" font-size="11.5" fill="var(--fig-ink, #1f2933)">Can I revoke the agent without touching the user, and vice versa?</text>
  <text x="756" y="207" font-size="10" fill="var(--fig-red, #c0392b)" text-anchor="end">If not, the two are fused</text>
  <rect x="24" y="230" width="752" height="40" rx="8" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="255" font-size="11" font-weight="700" fill="var(--fig-blue, #2563eb)">4</text>
  <text x="62" y="255" font-size="11.5" fill="var(--fig-ink, #1f2933)">Where is the permission check, and can the model influence it?</text>
  <text x="756" y="255" font-size="10" fill="var(--fig-red, #c0392b)" text-anchor="end">In the prompt &#8212; it is not a check</text>
  <rect x="24" y="278" width="752" height="40" rx="8" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="303" font-size="11" font-weight="700" fill="var(--fig-blue, #2563eb)">5</text>
  <text x="62" y="303" font-size="11.5" fill="var(--fig-ink, #1f2933)">What would the audit log say, and could I tell it from the user?</text>
  <text x="756" y="303" font-size="10" fill="var(--fig-red, #c0392b)" text-anchor="end">If not, you cannot investigate</text>
  <rect x="24" y="330" width="752" height="46" rx="10" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)" stroke-width="2"/>
  <text x="400" y="358" font-size="12.5" font-weight="700" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">Passes all five: defensible in front of a regulator. Fails any one: a demo, however good it looks.</text>
</svg>
