<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="risk-one-review-t risk-one-review-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="risk-one-review-t">One risk review becomes many approvals</title>
  <desc id="risk-one-review-d">The risk partner approves the onboarding path once: pick a guardrail from the catalog, declare a data classification, receive a tagged inference profile. Every use case that follows that path inherits the approval.</desc>
  <rect width="800" height="330" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">One review, a hundred approvals</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">Approve the path once, and every use case that follows it inherits the approval. This is why platform work outranks any single application.</text>
  <rect x="24" y="86" width="176" height="92" rx="10" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)" stroke-width="2"/>
  <text x="112" y="120" font-size="12.5" font-weight="700" fill="var(--fig-blue-ink, #17315e)" text-anchor="middle">Risk partner</text>
  <text x="112" y="138" font-size="12.5" font-weight="700" fill="var(--fig-blue-ink, #17315e)" text-anchor="middle">approves the path</text>
  <text x="112" y="158" font-size="10" fill="var(--fig-blue-ink-2, #33507f)" text-anchor="middle">once</text>
  <path d="M200,132 L236,132" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.6"/>
  <text x="300" y="76" font-size="9.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle" letter-spacing="0.6">THE SELF-SERVICE PATH</text>
  <rect x="242" y="86" width="252" height="28" rx="7" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <text x="256" y="105" font-size="10.5" fill="var(--fig-green, #0f6f4f)">1 &#183; Pick a guardrail from the catalog</text>
  <rect x="242" y="118" width="252" height="28" rx="7" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <text x="256" y="137" font-size="10.5" fill="var(--fig-green, #0f6f4f)">2 &#183; Declare a data classification</text>
  <rect x="242" y="150" width="252" height="28" rx="7" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <text x="256" y="169" font-size="10.5" fill="var(--fig-green, #0f6f4f)">3 &#183; Receive a tagged inference profile</text>
  <path d="M494,132 L530,132" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.6"/>
  <rect x="536" y="86" width="240" height="22" rx="6" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <circle cx="551" cy="97" r="6" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <path d="M548,97 L550.2,99.4 L554.2,94.4" fill="none" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="566" y="101" font-size="10" fill="var(--fig-ink, #1f2933)">Use case A &#8212; inherits the approval</text>
  <rect x="536" y="112" width="240" height="22" rx="6" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <circle cx="551" cy="123" r="6" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <path d="M548,123 L550.2,125.4 L554.2,120.4" fill="none" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="566" y="127" font-size="10" fill="var(--fig-ink, #1f2933)">Use case B &#8212; inherits the approval</text>
  <rect x="536" y="138" width="240" height="22" rx="6" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <circle cx="551" cy="149" r="6" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <path d="M548,149 L550.2,151.4 L554.2,146.4" fill="none" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="566" y="153" font-size="10" fill="var(--fig-ink, #1f2933)">Use case C &#8212; inherits the approval</text>
  <rect x="536" y="164" width="240" height="22" rx="6" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <circle cx="551" cy="175" r="6" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <path d="M548,175 L550.2,177.4 L554.2,172.4" fill="none" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="566" y="179" font-size="10" fill="var(--fig-ink, #1f2933)">Use case D &#8212; inherits the approval</text>
  <text x="656" y="208" font-size="10" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">&#8230; and every one after it</text>
  <line x1="24" y1="238" x2="776" y2="238" stroke="var(--fig-rule-3, #e2e8f0)"/>
  <text x="24" y="262" font-size="12" font-weight="700" fill="var(--fig-ink, #1f2933)">The habit that makes it work</text>
  <text x="24" y="284" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">Show the control map before the architecture is finished, and ask which risks they would add. It costs an hour and converts</text>
  <text x="24" y="300" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">a gatekeeper into a co-author &#8212; and a control the risk partner helped design is one they will defend to their own leadership.</text>
</svg>
