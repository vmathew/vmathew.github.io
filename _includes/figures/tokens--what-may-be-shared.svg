<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="tokens-share-t tokens-share-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="tokens-share-t">What may be shared across users, and what must not</title>
  <desc id="tokens-share-d">A two-by-two grid. Rows: is the content personal or permission-dependent, or the same for everyone. Columns: is it a prompt input or a generated answer. Public inputs and public answers may be cached across users; anything personal or entitlement-dependent must be cached per user or not at all.</desc>
  <rect width="800" height="330" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">The sharing line is a permission line</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">Decide per use case, at the gateway, before anyone turns a cache on.</text>

  <!-- column headers -->
  <text x="330" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fig-muted-2, #7a8896)" letter-spacing="0.7">PROMPT INPUT</text>
  <text x="620" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fig-muted-2, #7a8896)" letter-spacing="0.7">GENERATED ANSWER</text>
  <!-- row headers -->
  <text x="24" y="150" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">Same for everyone</text>
  <text x="24" y="166" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">policy text, product docs,</text>
  <text x="24" y="180" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">tool schemas, public FAQs</text>
  <text x="24" y="246" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">Personal or entitled</text>
  <text x="24" y="262" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">a user's records, anything</text>
  <text x="24" y="276" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">behind a permission check</text>

  <!-- cells -->
  <rect x="190" y="100" width="280" height="96" rx="10" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <text x="330" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fig-green, #0f6f4f)">Share freely</text>
  <text x="330" y="150" text-anchor="middle" font-size="10.5" fill="var(--fig-green-2, #0f7a56)">Prompt caching across all users.</text>
  <text x="330" y="166" text-anchor="middle" font-size="10.5" fill="var(--fig-green-2, #0f7a56)">Shared knowledge base. Shared memory namespace.</text>

  <rect x="480" y="100" width="280" height="96" rx="10" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <text x="620" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fig-green, #0f6f4f)">Share, with a TTL</text>
  <text x="620" y="150" text-anchor="middle" font-size="10.5" fill="var(--fig-green-2, #0f7a56)">Semantic response cache, tight threshold,</text>
  <text x="620" y="166" text-anchor="middle" font-size="10.5" fill="var(--fig-green-2, #0f7a56)">invalidated when the source document changes.</text>

  <rect x="190" y="206" width="280" height="96" rx="10" fill="var(--fig-amber-bg, #fdf3e0)" stroke="var(--fig-amber-line, #e8cc9a)"/>
  <text x="330" y="236" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fig-amber-ink, #8a5a13)">Per user only</text>
  <text x="330" y="256" text-anchor="middle" font-size="10.5" fill="var(--fig-amber, #b7791f)">Cache within the user's own session.</text>
  <text x="330" y="272" text-anchor="middle" font-size="10.5" fill="var(--fig-amber, #b7791f)">Memory in the user's namespace, never the shared one.</text>

  <rect x="480" y="206" width="280" height="96" rx="10" fill="var(--fig-red-bg, #fdeceb)" stroke="var(--fig-red-line, #eab5ae)"/>
  <text x="620" y="236" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fig-red, #c0392b)">Never across users</text>
  <text x="620" y="256" text-anchor="middle" font-size="10.5" fill="var(--fig-red, #c0392b)">A cached answer is a permission bypass waiting</text>
  <text x="620" y="272" text-anchor="middle" font-size="10.5" fill="var(--fig-red, #c0392b)">to happen. Generate every time.</text>

  <text x="24" y="318" font-size="10.5" fill="var(--fig-faint, #98a4b3)">The bottom-right cell is where a "cost optimisation" becomes a data-leak incident.</text>
</svg>
