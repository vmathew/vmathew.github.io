<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="outlive-split-t outlive-split-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="outlive-split-t">The review test for adding a second agent</title>
  <desc id="outlive-split-d">Ask what the second agent knows, or may do, that the first must not. If nothing, merge them: same owner, same permissions, one context, one agent with better tools. If something real, split, but only for a boundary of ownership or permission or for a specialization large enough to need its own model, prompt or tools, and route the call through the gateway with its own identity. Every split costs a trust boundary, a second identity, a second context window and a second injection point.</desc>
  <defs><marker id="outlive-split-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--fig-muted, #5b6b7b)"/></marker></defs>
  <rect width="800" height="340" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">The test before adding a second agent</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">Ask it in review, before the diagram grows a second box.</text>
  <rect x="150" y="68" width="500" height="56" rx="10" fill="var(--fig-blue-bg-2, #f3f7fd)" stroke="var(--fig-blue-line, #93b0f5)" stroke-width="1.5"/>
  <text x="400" y="92" font-size="13" font-weight="700" fill="var(--fig-blue-ink, #17315e)" text-anchor="middle">What does the second agent know, or may it do,</text>
  <text x="400" y="110" font-size="13" font-weight="700" fill="var(--fig-blue-ink, #17315e)" text-anchor="middle">that the first must not?</text>
  <line x1="300" y1="126" x2="214" y2="160" stroke="var(--fig-muted, #5b6b7b)" stroke-width="1.6" marker-end="url(#outlive-split-a)"/>
  <line x1="500" y1="126" x2="586" y2="160" stroke="var(--fig-muted, #5b6b7b)" stroke-width="1.6" marker-end="url(#outlive-split-a)"/>
  <text x="230" y="146" font-size="11" font-weight="700" fill="var(--fig-muted, #5b6b7b)" text-anchor="end">Nothing</text>
  <text x="570" y="146" font-size="11" font-weight="700" fill="var(--fig-muted, #5b6b7b)">Something real</text>
  <rect x="24" y="166" width="360" height="110" rx="10" fill="var(--fig-amber-bg, #fdf3e0)" stroke="var(--fig-amber-line, #e8cc9a)"/>
  <text x="44" y="188" font-size="9" font-weight="700" fill="var(--fig-amber-ink, #8a5a13)" letter-spacing="0.7">MERGE THEM</text>
  <text x="44" y="210" font-size="13" font-weight="700" fill="var(--fig-amber-ink, #8a5a13)">One agent, better tools</text>
  <text x="44" y="232" font-size="10.5" fill="var(--fig-amber-ink, #8a5a13)">Same owner, same permissions, could share a context.</text>
  <text x="44" y="248" font-size="10.5" fill="var(--fig-amber-ink, #8a5a13)">Splitting made it harder to trace and test,</text>
  <text x="44" y="264" font-size="10.5" fill="var(--fig-amber-ink, #8a5a13)">and no safer.</text>
  <rect x="416" y="166" width="360" height="110" rx="10" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <text x="436" y="188" font-size="9" font-weight="700" fill="var(--fig-green, #0f6f4f)" letter-spacing="0.7">SPLIT, THROUGH THE GATEWAY</text>
  <text x="436" y="210" font-size="13" font-weight="700" fill="var(--fig-green, #0f6f4f)">Only for one of two reasons</text>
  <text x="436" y="232" font-size="10.5" fill="var(--fig-green, #0f6f4f)">&#183; A boundary of ownership or permission</text>
  <text x="436" y="248" font-size="10.5" fill="var(--fig-green, #0f6f4f)">&#183; A specialization big enough for its own model or tools</text>
  <text x="436" y="264" font-size="10.5" fill="var(--fig-green, #0f6f4f)">&#8594; Its own identity, called like any other tool.</text>
  <rect x="24" y="294" width="752" height="30" rx="8" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="400" y="313" font-size="10.5" fill="var(--fig-muted, #5b6b7b)" text-anchor="middle">Every split costs: a trust boundary &#183; a second identity &#183; a second context window &#183; a second injection point</text>
</svg>
