<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" width="800" height="384" role="img" aria-labelledby="gov-not-just-a-workload-t gov-not-just-a-workload-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="gov-not-just-a-workload-t">How an AI system differs from a conventional workload</title>
  <desc id="gov-not-just-a-workload-d">A conventional workload is deterministic, stores data, fails loudly, and its unit of risk is the resource. An AI system is probabilistic, produces decisions, is confidently wrong quietly, and its unit of risk is the individual call.</desc>
  <rect width="800" height="384" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">Not just another workload</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">The cloud playbook transfers. The thing it is applied to does not behave the same way.</text>
  <text x="188" y="86" font-size="9.5" font-weight="700" fill="var(--fig-blue-ink-2, #33507f)" letter-spacing="0.7">A CONVENTIONAL WORKLOAD</text>
  <text x="476" y="86" font-size="9.5" font-weight="700" fill="var(--fig-amber-ink, #8a5a13)" letter-spacing="0.7">AN AI SYSTEM</text>
  <line x1="24" y1="94" x2="776" y2="94" stroke="var(--fig-rule-2, #cfd8e3)" stroke-width="2"/>
  <rect x="24" y="102" width="752" height="38" rx="7" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="126" font-size="11" font-weight="700" fill="var(--fig-ink, #1f2933)">Behaviour</text>
  <text x="188" y="126" font-size="10.5" fill="var(--fig-blue-ink-2, #33507f)">Deterministic &#8212; same input, same output</text>
  <text x="476" y="126" font-size="10.5" fill="var(--fig-amber-ink, #8a5a13)">Probabilistic &#8212; the same prompt can differ</text>
  <rect x="24" y="146" width="752" height="38" rx="7" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="170" font-size="11" font-weight="700" fill="var(--fig-ink, #1f2933)">What it does</text>
  <text x="188" y="170" font-size="10.5" fill="var(--fig-blue-ink-2, #33507f)">Stores, moves and transforms data</text>
  <text x="476" y="170" font-size="10.5" fill="var(--fig-amber-ink, #8a5a13)">Produces decisions and content from data</text>
  <rect x="24" y="190" width="752" height="38" rx="7" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="214" font-size="11" font-weight="700" fill="var(--fig-ink, #1f2933)">Failure mode</text>
  <text x="188" y="214" font-size="10.5" fill="var(--fig-blue-ink-2, #33507f)">It breaks, loudly</text>
  <text x="476" y="214" font-size="10.5" fill="var(--fig-amber-ink, #8a5a13)">It is confidently wrong, quietly</text>
  <rect x="24" y="234" width="752" height="38" rx="7" fill="var(--fig-blue-bg-2, #f3f7fd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="44" y="258" font-size="11" font-weight="700" fill="var(--fig-ink, #1f2933)">Unit of risk</text>
  <text x="188" y="258" font-size="10.5" fill="var(--fig-blue-ink-2, #33507f)">The resource</text>
  <text x="476" y="258" font-size="10.5" fill="var(--fig-amber-ink, #8a5a13)">The individual call</text>
  <rect x="24" y="278" width="752" height="38" rx="7" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="302" font-size="11" font-weight="700" fill="var(--fig-ink, #1f2933)">What you inspect</text>
  <text x="188" y="302" font-size="10.5" fill="var(--fig-blue-ink-2, #33507f)">Configuration</text>
  <text x="476" y="302" font-size="10.5" fill="var(--fig-amber-ink, #8a5a13)">Configuration, and the content</text>
  <rect x="24" y="330" width="752" height="36" rx="8" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="400" y="353" font-size="11" font-weight="700" fill="var(--fig-blue-ink, #17315e)" text-anchor="middle">A call leaves nothing behind to attach a control to. Governance happens at invocation, or not at all.</text>
</svg>
