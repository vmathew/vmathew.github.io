<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="routing-cascading-t routing-cascading-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="routing-cascading-t">How cascading works</title>
  <desc id="routing-cascading-d">The request goes to the cheap model first. An objective check decides whether the answer is good enough. If it passes, you are done at the cheap price. If it fails, the request escalates to the frontier model and the user waits for two calls.</desc>
  <defs><marker id="routing-cascading-g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--fig-green-2, #0f7a56)"/></marker><marker id="routing-cascading-r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--fig-red, #c0392b)"/></marker></defs>
  <rect width="800" height="320" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">Cascading: pay for the strong model only when you needed it</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">The whole pattern rests on one hard part &#8212; a reliable &#8220;was that good enough?&#8221; signal.</text>
  <rect x="24" y="96" width="112" height="48" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="80" y="125" font-size="11.5" fill="var(--fig-ink, #1f2933)" text-anchor="middle">Request</text>
  <line x1="136" y1="120" x2="166" y2="120" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.6" marker-end="url(#routing-cascading-g)"/>
  <rect x="172" y="96" width="132" height="48" rx="8" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <text x="238" y="117" font-size="11.5" font-weight="700" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">Cheap model</text>
  <text x="238" y="132" font-size="9" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">tier 1</text>
  <line x1="304" y1="120" x2="334" y2="120" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.6" marker-end="url(#routing-cascading-g)"/>
  <rect x="340" y="88" width="168" height="64" rx="8" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)" stroke-width="2"/>
  <text x="424" y="110" font-size="11.5" font-weight="700" fill="var(--fig-blue-ink, #17315e)" text-anchor="middle">The check</text>
  <text x="424" y="126" font-size="9" fill="var(--fig-blue-ink-2, #33507f)" text-anchor="middle">Does the JSON parse? Does the</text>
  <text x="424" y="138" font-size="9" fill="var(--fig-blue-ink-2, #33507f)" text-anchor="middle">code compile? Did it cite a source?</text>
  <text x="556" y="104" font-size="9.5" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">passes</text>
  <line x1="508" y1="120" x2="596" y2="120" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.6" marker-end="url(#routing-cascading-g)"/>
  <rect x="602" y="96" width="174" height="48" rx="8" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <text x="689" y="117" font-size="11.5" font-weight="700" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">Done, at tier-1 price</text>
  <text x="689" y="132" font-size="9" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">one call</text>
  <path d="M424,152 L424,196 L596,196" fill="none" stroke="var(--fig-red, #c0392b)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#routing-cascading-r)"/>
  <text x="440" y="190" font-size="9.5" fill="var(--fig-red, #c0392b)">fails</text>
  <rect x="602" y="172" width="174" height="48" rx="8" fill="var(--fig-red-bg, #fdeceb)" stroke="var(--fig-red-line, #eab5ae)"/>
  <text x="689" y="193" font-size="11.5" font-weight="700" fill="var(--fig-red, #c0392b)" text-anchor="middle">Escalate to frontier</text>
  <text x="689" y="208" font-size="9" fill="var(--fig-red, #c0392b)" text-anchor="middle">the user waits for two calls</text>
  <line x1="24" y1="248" x2="776" y2="248" stroke="var(--fig-rule-3, #e2e8f0)"/>
  <text x="24" y="272" font-size="10.5" font-weight="700" fill="var(--fig-green, #0f6f4f)">Works best</text>
  <text x="24" y="290" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">Structured output, code, retrieval with verifiable citations &#8212; where the check is objective.</text>
  <text x="440" y="272" font-size="10.5" font-weight="700" fill="var(--fig-red, #c0392b)">Works worst</text>
  <text x="440" y="290" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">Open-ended prose, where &#8220;good enough&#8221; is a judgment call.</text>
</svg>
