<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="harness-map-t harness-map-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="harness-map-t">The agent harness, and which AWS service fills each part</title>
  <desc id="harness-map-d">The model sits in the centre. Around it, eight harness responsibilities — the loop, context, tools, memory, permissions, identity, evaluation and telemetry — each labelled with the Bedrock or AgentCore component that provides it, or with "yours" where no managed service does.</desc>
  <rect width="800" height="520" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">The harness is everything around the model</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">Each box is a responsibility. The small label is who fills it on AWS today.</text>

  <!-- outer harness frame -->
  <rect x="24" y="66" width="752" height="430" rx="14" fill="var(--fig-panel-2, #f6f8fa)" stroke="var(--fig-rule-2, #cfd8e3)" stroke-dasharray="6 5"/>
  <text x="40" y="88" font-size="10" font-weight="700" fill="var(--fig-muted-2, #7a8896)" letter-spacing="0.8">HARNESS</text>

  <!-- model core -->
  <rect x="318" y="218" width="164" height="90" rx="12" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)" stroke-width="1.5"/>
  <text x="400" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="var(--fig-blue-ink, #17315e)">Model</text>
  <text x="400" y="272" text-anchor="middle" font-size="11" fill="var(--fig-blue-ink-2, #33507f)">Bedrock · inference profile</text>
  <text x="400" y="288" text-anchor="middle" font-size="11" fill="var(--fig-blue-ink-2, #33507f)">+ Guardrail</text>

  <!-- top row -->
  <g>
    <rect x="48" y="104" width="220" height="82" rx="10" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule, #dde4ec)"/>
    <text x="64" y="128" font-size="12.5" font-weight="700" fill="var(--fig-ink, #1f2933)">The loop</text>
    <text x="64" y="146" font-size="11" fill="var(--fig-muted, #5b6b7b)">Call model, pick tool, feed result back, stop.</text>
    <rect x="64" y="156" width="190" height="18" rx="9" fill="var(--fig-amber-bg, #fdf3e0)" stroke="var(--fig-amber-line, #e8cc9a)"/>
    <text x="159" y="169" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--fig-amber-ink, #8a5a13)">Strands (yours) · or AgentCore Harness</text>
  </g>
  <g>
    <rect x="290" y="104" width="220" height="82" rx="10" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule, #dde4ec)"/>
    <text x="306" y="128" font-size="12.5" font-weight="700" fill="var(--fig-ink, #1f2933)">Context</text>
    <text x="306" y="146" font-size="11" fill="var(--fig-muted, #5b6b7b)">What goes in the window; what gets dropped.</text>
    <rect x="306" y="156" width="190" height="18" rx="9" fill="var(--fig-amber-bg, #fdf3e0)" stroke="var(--fig-amber-line, #e8cc9a)"/>
    <text x="401" y="169" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fig-amber-ink, #8a5a13)">Yours · prompt caching helps</text>
  </g>
  <g>
    <rect x="532" y="104" width="220" height="82" rx="10" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule, #dde4ec)"/>
    <text x="548" y="128" font-size="12.5" font-weight="700" fill="var(--fig-ink, #1f2933)">Tools</text>
    <text x="548" y="146" font-size="11" fill="var(--fig-muted, #5b6b7b)">Definition, dispatch, one door for all of them.</text>
    <rect x="548" y="156" width="190" height="18" rx="9" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
    <text x="643" y="169" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fig-green, #0f6f4f)">AgentCore Gateway · MCP</text>
  </g>

  <!-- middle row (left / right of model) -->
  <g>
    <rect x="48" y="222" width="220" height="82" rx="10" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule, #dde4ec)"/>
    <text x="64" y="246" font-size="12.5" font-weight="700" fill="var(--fig-ink, #1f2933)">Memory</text>
    <text x="64" y="264" font-size="11" fill="var(--fig-muted, #5b6b7b)">Across turns and sessions. Not your corpus.</text>
    <rect x="64" y="274" width="190" height="18" rx="9" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
    <text x="159" y="287" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fig-green, #0f6f4f)">AgentCore Memory</text>
  </g>
  <g>
    <rect x="532" y="222" width="220" height="82" rx="10" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule, #dde4ec)"/>
    <text x="548" y="246" font-size="12.5" font-weight="700" fill="var(--fig-ink, #1f2933)">Permissions</text>
    <text x="548" y="264" font-size="11" fill="var(--fig-muted, #5b6b7b)">Which tools, when, and who approves.</text>
    <rect x="548" y="274" width="190" height="18" rx="9" fill="var(--fig-amber-bg, #fdf3e0)" stroke="var(--fig-amber-line, #e8cc9a)"/>
    <text x="643" y="287" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fig-amber-ink, #8a5a13)">Policy + SCPs + your approval gate</text>
  </g>

  <!-- bottom row -->
  <g>
    <rect x="48" y="340" width="220" height="82" rx="10" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule, #dde4ec)"/>
    <text x="64" y="364" font-size="12.5" font-weight="700" fill="var(--fig-ink, #1f2933)">Identity</text>
    <text x="64" y="382" font-size="11" fill="var(--fig-muted, #5b6b7b)">Who the agent is, and who it acts for.</text>
    <rect x="64" y="392" width="190" height="18" rx="9" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
    <text x="159" y="405" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fig-green, #0f6f4f)">AgentCore Identity</text>
  </g>
  <g>
    <rect x="290" y="340" width="220" height="82" rx="10" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule, #dde4ec)"/>
    <text x="306" y="364" font-size="12.5" font-weight="700" fill="var(--fig-ink, #1f2933)">Evaluation</text>
    <text x="306" y="382" font-size="11" fill="var(--fig-muted, #5b6b7b)">Did it get better or worse after the change?</text>
    <rect x="306" y="392" width="190" height="18" rx="9" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
    <text x="401" y="405" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fig-green, #0f6f4f)">AgentCore Evaluations · your test set</text>
  </g>
  <g>
    <rect x="532" y="340" width="220" height="82" rx="10" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule, #dde4ec)"/>
    <text x="548" y="364" font-size="12.5" font-weight="700" fill="var(--fig-ink, #1f2933)">Telemetry</text>
    <text x="548" y="382" font-size="11" fill="var(--fig-muted, #5b6b7b)">Traces that cannot be turned off.</text>
    <rect x="548" y="392" width="190" height="18" rx="9" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
    <text x="643" y="405" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fig-green, #0f6f4f)">Observability + invocation logging</text>
  </g>

  <!-- legend -->
  <rect x="48" y="450" width="12" height="12" rx="6" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <text x="66" y="460" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">Managed: adopt it, configure it, evidence it</text>
  <rect x="300" y="450" width="12" height="12" rx="6" fill="var(--fig-amber-bg, #fdf3e0)" stroke="var(--fig-amber-line, #e8cc9a)"/>
  <text x="318" y="460" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">Partly or wholly yours: a decision the service does not make for you</text>
  <text x="48" y="484" font-size="10.5" fill="var(--fig-faint, #98a4b3)">Guardrails and cost attribution wrap the model call and apply to every harness. The line under a harness is an SCP.</text>
</svg>
