<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" width="800" height="392" role="img" aria-labelledby="identity-four-limits-t identity-four-limits-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="identity-four-limits-t">Four separate limits, each enforced outside the agent</title>
  <desc id="identity-four-limits-d">Least privilege for an agent is four limits: which tools it may call, what each tool may do for this user, how much it may do in one task, and which actions require a human. Each is enforced by the gateway, the downstream system or the approval gate — never by the prompt.</desc>
  <rect width="800" height="392" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">Least privilege is four limits, not one</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">For people it is mostly roles. For an agent that picks its own tools at runtime, roles are not enough.</text>
  <text x="44" y="86" font-size="9.5" font-weight="700" fill="var(--fig-muted-2, #7a8896)" letter-spacing="0.7">THE LIMIT</text>
  <text x="330" y="86" font-size="9.5" font-weight="700" fill="var(--fig-muted-2, #7a8896)" letter-spacing="0.7">WHAT IT IS</text>
  <text x="614" y="86" font-size="9.5" font-weight="700" fill="var(--fig-green, #0f6f4f)" letter-spacing="0.7">ENFORCED BY</text>
  <line x1="24" y1="94" x2="776" y2="94" stroke="var(--fig-rule-2, #cfd8e3)" stroke-width="2"/>
  <rect x="24" y="104" width="752" height="46" rx="8" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <circle cx="44" cy="127" r="9" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="44" y="131" font-size="10" font-weight="700" fill="var(--fig-blue, #2563eb)" text-anchor="middle">1</text>
  <text x="62" y="132" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">Which tools it may call at all</text>
  <text x="330" y="132" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">An allowlist on the agent&#8217;s identity</text>
  <text x="614" y="132" font-size="10.5" font-weight="600" fill="var(--fig-green, #0f6f4f)">The gateway</text>
  <rect x="24" y="158" width="752" height="46" rx="8" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <circle cx="44" cy="181" r="9" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="44" y="185" font-size="10" font-weight="700" fill="var(--fig-blue, #2563eb)" text-anchor="middle">2</text>
  <text x="62" y="186" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">What each tool may do for this user</text>
  <text x="330" y="186" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">The user&#8217;s own entitlements</text>
  <text x="614" y="186" font-size="10.5" font-weight="600" fill="var(--fig-green, #0f6f4f)">The downstream system</text>
  <rect x="24" y="212" width="752" height="46" rx="8" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <circle cx="44" cy="235" r="9" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="44" y="239" font-size="10" font-weight="700" fill="var(--fig-blue, #2563eb)" text-anchor="middle">3</text>
  <text x="62" y="240" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">How much it may do in one task</text>
  <text x="330" y="240" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">Step, spend and rate limits</text>
  <text x="614" y="240" font-size="10.5" font-weight="600" fill="var(--fig-green, #0f6f4f)">The gateway</text>
  <rect x="24" y="266" width="752" height="46" rx="8" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <circle cx="44" cy="289" r="9" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="44" y="293" font-size="10" font-weight="700" fill="var(--fig-blue, #2563eb)" text-anchor="middle">4</text>
  <text x="62" y="294" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">Which actions need a human</text>
  <text x="330" y="294" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">Consequential actions go to a pending state</text>
  <text x="614" y="294" font-size="10.5" font-weight="600" fill="var(--fig-green, #0f6f4f)">The approval gate</text>
  <rect x="24" y="326" width="752" height="52" rx="10" fill="var(--fig-red-bg, #fdeceb)" stroke="var(--fig-red-line, #eab5ae)" stroke-width="2"/>
  <text x="400" y="350" font-size="12.5" font-weight="700" fill="var(--fig-red, #c0392b)" text-anchor="middle">If the check lives in the prompt, it is not a check.</text>
  <text x="400" y="368" font-size="10.5" fill="var(--fig-red, #c0392b)" text-anchor="middle">The prompt is the one place a malicious document can rewrite.</text>
</svg>
