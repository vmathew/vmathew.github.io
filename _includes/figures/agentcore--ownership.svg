<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="agentcore-ownership-t agentcore-ownership-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="agentcore-ownership-t">Who owns what once AgentCore is adopted</title>
  <desc id="agentcore-ownership-d">The platform team adopts the primitives, wires them into the governed invocation layer, makes the Gateway and Runtime mandatory with organization policy and turns on observability. Business units own the agents, the tool classifications, the evaluation sets and the accountable name.</desc>
  <rect width="800" height="300" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">Who owns what</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">The primitives change the cost of the mechanisms. They do not move the accountability.</text>
  <rect x="20" y="66" width="372" height="196" rx="10" fill="var(--fig-blue-bg-2, #f3f7fd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <rect x="20" y="66" width="372" height="4" rx="2" fill="var(--fig-blue, #2563eb)"/>
  <text x="40" y="96" font-size="13.5" font-weight="700" fill="var(--fig-blue-ink, #17315e)">The platform team</text>
  <circle cx="45" cy="120" r="2.5" fill="var(--fig-blue-line, #93b0f5)"/>
  <text x="56" y="124" font-size="11.5" fill="var(--fig-ink, #1f2933)">Adopts the primitives</text>
  <circle cx="45" cy="146" r="2.5" fill="var(--fig-blue-line, #93b0f5)"/>
  <text x="56" y="150" font-size="11.5" fill="var(--fig-ink, #1f2933)">Wires them into the invocation layer</text>
  <circle cx="45" cy="172" r="2.5" fill="var(--fig-blue-line, #93b0f5)"/>
  <text x="56" y="176" font-size="11.5" fill="var(--fig-ink, #1f2933)">Makes Gateway + Runtime mandatory</text>
  <text x="52" y="202" font-size="11" fill="var(--fig-blue-ink-2, #33507f)">with organization policy</text>
  <circle cx="45" cy="224" r="2.5" fill="var(--fig-blue-line, #93b0f5)"/>
  <text x="56" y="228" font-size="11.5" fill="var(--fig-ink, #1f2933)">Turns on Observability for everyone</text>
  <rect x="408" y="66" width="372" height="196" rx="10" fill="var(--fig-amber-bg, #fdf3e0)" stroke="var(--fig-amber-line, #e8cc9a)"/>
  <rect x="408" y="66" width="372" height="4" rx="2" fill="var(--fig-amber-ink, #8a5a13)"/>
  <text x="428" y="96" font-size="13.5" font-weight="700" fill="var(--fig-amber-ink, #8a5a13)">The business unit</text>
  <circle cx="433" cy="122" r="2.5" fill="var(--fig-amber-line, #e8cc9a)"/>
  <text x="448" y="126" font-size="11.5" fill="var(--fig-ink, #1f2933)">The agents themselves</text>
  <circle cx="433" cy="152" r="2.5" fill="var(--fig-amber-line, #e8cc9a)"/>
  <text x="448" y="156" font-size="11.5" fill="var(--fig-ink, #1f2933)">The tools&#8217; classifications</text>
  <circle cx="433" cy="182" r="2.5" fill="var(--fig-amber-line, #e8cc9a)"/>
  <text x="448" y="186" font-size="11.5" fill="var(--fig-ink, #1f2933)">The evaluation sets</text>
  <circle cx="433" cy="212" r="2.5" fill="var(--fig-amber-line, #e8cc9a)"/>
  <text x="448" y="216" font-size="11.5" fill="var(--fig-ink, #1f2933)">The accountable name</text>
  <text x="400" y="286" font-size="11" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">One risk review of the path, then every agent that follows it inherits the approval.</text>
</svg>
