<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 436" width="800" height="436" role="img" aria-labelledby="exec-demo-to-real-t exec-demo-to-real-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="exec-demo-to-real-t">The demo and the production version are the same use case in two configurations</title>
  <desc id="exec-demo-to-real-d">Owner, cost centre, inference profile, platform and identity stay the same. What changes between demo and production is the guardrail tier, the data classification, the tool permissions, the cost cap and whether a risk review is required.</desc>
  <rect width="800" height="436" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">The demo is not a throwaway</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">Built on the platform, the demo and the real thing are one use case in two configurations.</text>
  <rect x="24" y="66" width="752" height="44" rx="9" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="44" y="84" font-size="9" fill="var(--fig-blue-ink-2, #33507f)" letter-spacing="0.7">IDENTICAL IN BOTH</text>
  <text x="44" y="101" font-size="11.5" font-weight="700" fill="var(--fig-blue-ink, #17315e)">Owner &#183; cost centre &#183; inference profile &#183; the platform &#183; the identity it calls as</text>
  <text x="300" y="138" font-size="9.5" font-weight="700" fill="var(--fig-amber-ink, #8a5a13)" letter-spacing="0.7">DEMO &#8212; IN DAYS</text>
  <text x="540" y="138" font-size="9.5" font-weight="700" fill="var(--fig-green, #0f6f4f)" letter-spacing="0.7">REAL &#8212; AFTER REVIEW</text>
  <line x1="24" y1="146" x2="776" y2="146" stroke="var(--fig-rule-2, #cfd8e3)" stroke-width="2"/>
  <rect x="24" y="156" width="752" height="34" rx="7" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="178" font-size="11" font-weight="700" fill="var(--fig-ink, #1f2933)">Guardrail</text>
  <text x="300" y="178" font-size="10.5" fill="var(--fig-amber-ink, #8a5a13)">Permissive, with logging</text>
  <text x="540" y="178" font-size="10.5" fill="var(--fig-green, #0f6f4f)">Strict, from the catalog</text>
  <rect x="24" y="196" width="752" height="34" rx="7" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="218" font-size="11" font-weight="700" fill="var(--fig-ink, #1f2933)">Data</text>
  <text x="300" y="218" font-size="10.5" fill="var(--fig-amber-ink, #8a5a13)">Synthetic or public only</text>
  <text x="540" y="218" font-size="10.5" fill="var(--fig-green, #0f6f4f)">Real data, classified</text>
  <rect x="24" y="236" width="752" height="34" rx="7" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="258" font-size="11" font-weight="700" fill="var(--fig-ink, #1f2933)">Tools</text>
  <text x="300" y="258" font-size="10.5" fill="var(--fig-amber-ink, #8a5a13)">Read-only, or behind approval</text>
  <text x="540" y="258" font-size="10.5" fill="var(--fig-green, #0f6f4f)">Consequential, with approval flow</text>
  <rect x="24" y="276" width="752" height="34" rx="7" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="298" font-size="11" font-weight="700" fill="var(--fig-ink, #1f2933)">Cost</text>
  <text x="300" y="298" font-size="10.5" fill="var(--fig-amber-ink, #8a5a13)">Hard cap</text>
  <text x="540" y="298" font-size="10.5" fill="var(--fig-green, #0f6f4f)">Normal budget and attribution</text>
  <rect x="24" y="316" width="752" height="34" rx="7" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="338" font-size="11" font-weight="700" fill="var(--fig-ink, #1f2933)">Review</text>
  <text x="300" y="338" font-size="10.5" fill="var(--fig-amber-ink, #8a5a13)">None needed at this risk</text>
  <text x="540" y="338" font-size="10.5" fill="var(--fig-green, #0f6f4f)">Risk review</text>
  <rect x="24" y="364" width="752" height="44" rx="9" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <text x="400" y="384" font-size="12" font-weight="700" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">Every difference is a configuration change with a review attached.</text>
  <text x="400" y="400" font-size="10.5" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">When they ask how to make it real, the answer is a list &#8212; not a rebuild.</text>
</svg>
