<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="tokens-gw-t tokens-gw-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="tokens-gw-t">Four mechanisms, one gateway</title>
  <desc id="tokens-gw-d">Applications call a single invocation gateway. Inside it, four mechanisms sit in order: a semantic response cache checked first, then retrieval from a shared knowledge base, then shared memory, then a prompt assembled static-first so the provider's prefix cache hits. The gateway reports cache hit rate and savings per team alongside spend.</desc>
  <defs><marker id="tokens-gw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-faint-2, #6b7887)"/></marker></defs>
  <rect width="800" height="380" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">Where the four mechanisms live</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">Applied once, in the invocation layer, so every application benefits and every use case gets its own rules.</text>

  <!-- apps -->
  <rect x="24" y="150" width="110" height="34" rx="8" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="79" y="171" text-anchor="middle" font-size="11" fill="var(--fig-ink, #1f2933)">App A</text>
  <rect x="24" y="192" width="110" height="34" rx="8" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="79" y="213" text-anchor="middle" font-size="11" fill="var(--fig-ink, #1f2933)">App B</text>
  <rect x="24" y="234" width="110" height="34" rx="8" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="79" y="255" text-anchor="middle" font-size="11" fill="var(--fig-ink, #1f2933)">Agent C</text>
  <line x1="134" y1="167" x2="176" y2="200" stroke="var(--fig-faint-2, #6b7887)" stroke-width="1.5" marker-end="url(#tokens-gw-arrow)"/>
  <line x1="134" y1="209" x2="176" y2="209" stroke="var(--fig-faint-2, #6b7887)" stroke-width="1.5" marker-end="url(#tokens-gw-arrow)"/>
  <line x1="134" y1="251" x2="176" y2="218" stroke="var(--fig-faint-2, #6b7887)" stroke-width="1.5" marker-end="url(#tokens-gw-arrow)"/>

  <!-- gateway -->
  <rect x="180" y="76" width="440" height="270" rx="14" fill="var(--fig-blue-bg-2, #f3f7fd)" stroke="var(--fig-blue-line-2, #c4d5f7)" stroke-width="1.5"/>
  <text x="196" y="98" font-size="10" font-weight="700" fill="var(--fig-blue-ink-2, #33507f)" letter-spacing="0.8">INVOCATION GATEWAY</text>

  <rect x="196" y="110" width="408" height="44" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <text x="212" y="128" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">1  Semantic response cache</text>
  <text x="212" y="145" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">Only for use cases flagged shareable. Hit → answer without a model call.</text>

  <rect x="196" y="164" width="408" height="44" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-amber-line, #e8cc9a)"/>
  <text x="212" y="182" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">2  Retrieve, don't paste</text>
  <text x="212" y="199" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">Knowledge base returns a few hundred relevant tokens, not the document.</text>

  <rect x="196" y="218" width="408" height="44" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="212" y="236" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">3  Shared memory read</text>
  <text x="212" y="253" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">Team or tenant namespace; writes go through a governed path.</text>

  <rect x="196" y="272" width="408" height="44" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="212" y="290" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">4  Assemble prompt static-first</text>
  <text x="212" y="307" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">Cache breakpoint after the shared prefix; per-user content last.</text>

  <text x="196" y="336" font-size="10" fill="var(--fig-blue-ink-2, #33507f)">Reports: hit rate per mechanism · tokens avoided · saving per team, next to spend</text>

  <!-- model -->
  <line x1="620" y1="294" x2="662" y2="294" stroke="var(--fig-faint-2, #6b7887)" stroke-width="1.5" marker-end="url(#tokens-gw-arrow)"/>
  <rect x="666" y="266" width="110" height="56" rx="10" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="721" y="290" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--fig-blue-ink, #17315e)">Model</text>
  <text x="721" y="306" text-anchor="middle" font-size="10" fill="var(--fig-blue-ink-2, #33507f)">prefix cache hits</text>

  <text x="24" y="368" font-size="10.5" fill="var(--fig-faint, #98a4b3)">Guardrails, attribution and traces still wrap step 4. Caching sits inside the governed path, not around it.</text>
</svg>
