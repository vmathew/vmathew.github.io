<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 306" width="800" height="306" role="img" aria-labelledby="routing-traffic-vs-spend-t routing-traffic-vs-spend-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="routing-traffic-vs-spend-t">Most traffic is simple, and all of it goes to the frontier model</title>
  <desc id="routing-traffic-vs-spend-d">Roughly fifty-five percent of requests are simple and thirty percent moderate, yet every request is sent to the frontier tier, which costs about ten times more per token than the small tier.</desc>
  <rect width="800" height="306" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">Every package by overnight courier</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">The shape of the traffic and the shape of the bill are not the same shape.</text>
  <text x="24" y="86" font-size="11" font-weight="700" fill="var(--fig-ink, #1f2933)">What the traffic looks like</text>
  <rect x="24" y="96" width="414" height="46" rx="6" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <text x="231" y="117" font-size="11.5" font-weight="700" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">Simple</text>
  <text x="231" y="132" font-size="9.5" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">reformat, summarise, commit message</text>
  <rect x="442" y="96" width="226" height="46" rx="6" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="555" y="117" font-size="11.5" font-weight="700" fill="var(--fig-blue-ink, #17315e)" text-anchor="middle">Moderate</text>
  <text x="555" y="132" font-size="9.5" fill="var(--fig-blue-ink-2, #33507f)" text-anchor="middle">drafting, Q&amp;A, short analysis</text>
  <rect x="672" y="96" width="104" height="46" rx="6" fill="var(--fig-amber-bg, #fdf3e0)" stroke="var(--fig-amber-line, #e8cc9a)"/>
  <text x="724" y="117" font-size="11.5" font-weight="700" fill="var(--fig-amber-ink, #8a5a13)" text-anchor="middle">Complex</text>
  <text x="724" y="132" font-size="9.5" fill="var(--fig-amber-ink, #8a5a13)" text-anchor="middle">multi-doc, agentic</text>
  <text x="231" y="160" font-size="10" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">~55%</text>
  <text x="555" y="160" font-size="10" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">~30%</text>
  <text x="724" y="160" font-size="10" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">~15%</text>
  <text x="24" y="196" font-size="11" font-weight="700" fill="var(--fig-ink, #1f2933)">Where it all gets sent</text>
  <rect x="24" y="206" width="752" height="46" rx="6" fill="var(--fig-red-bg, #fdeceb)" stroke="var(--fig-red-line, #eab5ae)"/>
  <text x="400" y="227" font-size="11.5" font-weight="700" fill="var(--fig-red, #c0392b)" text-anchor="middle">Frontier tier &#8212; 100% of requests</text>
  <text x="400" y="242" font-size="9.5" fill="var(--fig-red, #c0392b)" text-anchor="middle">roughly 10&#215; the per-token price of the small tier</text>
  <text x="400" y="286" font-size="11" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">Not because anyone decided to. Because it was the model configured on day one.</text>
</svg>
