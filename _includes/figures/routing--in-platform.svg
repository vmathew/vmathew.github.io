<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="routing-in-platform-t routing-in-platform-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="routing-in-platform-t">Where routing sits in the platform</title>
  <desc id="routing-in-platform-d">The request arrives with its inference profile. Policy narrows the allowed set of models for that data classification, and routing may only choose within it. Rules assign a tier where they can and a classifier scores the rest. The chosen model is called with the required guardrail, and the trace records the requested model, the served model, the tier and the reason.</desc>
  <defs><marker id="routing-in-platform-g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--fig-green-2, #0f7a56)"/></marker></defs>
  <rect width="800" height="330" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">Routing belongs inside the policy envelope</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">Policy decides what is allowed. Routing only picks within it &#8212; never outside, whatever the complexity score says.</text>
  <rect x="216" y="80" width="340" height="128" rx="10" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="386" y="100" font-size="10" font-weight="700" fill="var(--fig-blue-ink, #17315e)" text-anchor="middle" letter-spacing="0.6">POLICY: THE ALLOWED SET</text>
  <rect x="24" y="118" width="164" height="52" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="106" y="139" font-size="11" font-weight="600" fill="var(--fig-ink, #1f2933)" text-anchor="middle">Inference profile</text>
  <text x="106" y="155" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">use case &#183; classification &#183; cost centre</text>
  <line x1="188" y1="144" x2="210" y2="144" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.6" marker-end="url(#routing-in-platform-g)"/>
  <rect x="234" y="112" width="140" height="64" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="304" y="134" font-size="11" font-weight="600" fill="var(--fig-ink, #1f2933)" text-anchor="middle">Rules</text>
  <text x="304" y="150" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">use case, length,</text>
  <text x="304" y="162" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">tools involved?</text>
  <line x1="374" y1="144" x2="394" y2="144" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.6" marker-end="url(#routing-in-platform-g)"/>
  <rect x="400" y="112" width="140" height="64" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="470" y="134" font-size="11" font-weight="600" fill="var(--fig-ink, #1f2933)" text-anchor="middle">Classifier</text>
  <text x="470" y="150" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">scores whatever</text>
  <text x="470" y="162" font-size="8.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">rules did not settle</text>
  <line x1="556" y1="144" x2="582" y2="144" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.6" marker-end="url(#routing-in-platform-g)"/>
  <rect x="588" y="118" width="188" height="52" rx="8" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)"/>
  <text x="682" y="139" font-size="11" font-weight="700" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">Chosen model + guardrail</text>
  <text x="682" y="155" font-size="8.5" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">the one the use case requires</text>
  <rect x="24" y="228" width="752" height="74" rx="10" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="252" font-size="12" font-weight="700" fill="var(--fig-ink, #1f2933)">What the trace must record</text>
  <text x="44" y="270" font-size="10" fill="var(--fig-muted, #5b6b7b)">Without the reason, &#8220;which model answered this?&#8221; becomes unanswerable &#8212; and so does every quality comparison by tier.</text>
  <rect x="44" y="278" width="102" height="20" rx="10" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="95" y="292" font-size="9" fill="var(--fig-blue-ink-2, #33507f)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">model requested</text>
  <rect x="155" y="278" width="85" height="20" rx="10" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="198" y="292" font-size="9" fill="var(--fig-blue-ink-2, #33507f)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">model served</text>
  <rect x="249" y="278" width="40" height="20" rx="10" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="269" y="292" font-size="9" fill="var(--fig-blue-ink-2, #33507f)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tier</text>
  <rect x="299" y="278" width="52" height="20" rx="10" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="324" y="292" font-size="9" fill="var(--fig-blue-ink-2, #33507f)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">reason</text>
</svg>
