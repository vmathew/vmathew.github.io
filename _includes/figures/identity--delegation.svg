<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 352" width="800" height="352" role="img" aria-labelledby="identity-delegation-t identity-delegation-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="identity-delegation-t">The delegation is what makes the action attributable without handing over the keyring</title>
  <desc id="identity-delegation-d">The user holds full entitlements. A short-lived scoped grant says user X allows agent Y to act for them, for this purpose, for this long. The agent holds only that grant, never the user credentials, and the downstream system sees both parties and writes an audit record naming both.</desc>
  <defs><marker id="identity-delegation-g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--fig-green-2, #0f7a56)"/></marker></defs>
  <rect width="800" height="352" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">The delegation, not the keyring</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">A valet key starts the car and does not open the boot. On-behalf-of access is the same idea.</text>
  <rect x="24" y="76" width="180" height="90" rx="10" fill="var(--fig-blue-bg-2, #f3f7fd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="114" y="102" font-size="12.5" font-weight="700" fill="var(--fig-blue-ink, #17315e)" text-anchor="middle">The user</text>
  <text x="114" y="122" font-size="10" fill="var(--fig-blue-ink-2, #33507f)" text-anchor="middle">Full entitlements</text>
  <text x="114" y="140" font-size="10" fill="var(--fig-blue-ink-2, #33507f)" text-anchor="middle">Their permissions are</text>
  <text x="114" y="153" font-size="10" fill="var(--fig-blue-ink-2, #33507f)" text-anchor="middle">the ceiling &#8212; never exceeded</text>
  <line x1="204" y1="121" x2="240" y2="121" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.6" marker-end="url(#identity-delegation-g)"/>
  <rect x="246" y="70" width="256" height="102" rx="10" fill="var(--fig-green-bg, #e3f5ec)" stroke="var(--fig-green-line, #9fd8bf)" stroke-width="2"/>
  <text x="374" y="94" font-size="12.5" font-weight="700" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">The delegation</text>
  <text x="374" y="114" font-size="10" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">&#8220;User X allows agent Y to act for them,</text>
  <text x="374" y="128" font-size="10" fill="var(--fig-green, #0f6f4f)" text-anchor="middle">for this purpose, for this long.&#8221;</text>
  <text x="374" y="152" font-size="9.5" fill="var(--fig-green, #0f6f4f)" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">short-lived &#183; scoped &#183; revocable</text>
  <line x1="502" y1="121" x2="538" y2="121" stroke="var(--fig-green-2, #0f7a56)" stroke-width="1.6" marker-end="url(#identity-delegation-g)"/>
  <rect x="544" y="76" width="232" height="90" rx="10" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <text x="660" y="102" font-size="12.5" font-weight="700" fill="var(--fig-ink, #1f2933)" text-anchor="middle">The agent</text>
  <text x="660" y="122" font-size="10" fill="var(--fig-muted, #5b6b7b)" text-anchor="middle">Its own registered identity,</text>
  <text x="660" y="136" font-size="10" fill="var(--fig-muted, #5b6b7b)" text-anchor="middle">plus the grant &#8212; and nothing else</text>
  <text x="660" y="155" font-size="10" fill="var(--fig-red, #c0392b)" text-anchor="middle">Never the user&#8217;s credentials</text>
  <rect x="24" y="196" width="752" height="62" rx="10" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="218" font-size="9" fill="var(--fig-muted-2, #7a8896)" letter-spacing="0.7">WHAT THE DOWNSTREAM SYSTEM SEES, AND WRITES DOWN</text>
  <text x="44" y="243" font-size="13" font-weight="700" fill="var(--fig-ink, #1f2933)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Agent Y, on behalf of user X, read record Z at 2:14 pm</text>
  <text x="400" y="292" font-size="11.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">Revoke the agent without touching the user. Revoke the user without touching the agent.</text>
  <text x="400" y="314" font-size="11.5" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">Neither bad answer can do either.</text>
</svg>
