<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 326" width="800" height="326" role="img" aria-labelledby="review-ask-dont-tell-t review-ask-dont-tell-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="review-ask-dont-tell-t">Asking instead of telling, and what each transfers</title>
  <desc id="review-ask-dont-tell-d">Instead of saying a design will not scale past one region, ask what happens when the second region comes online. Instead of saying an approval step is needed, ask the engineer to walk through what happens if the model calls the tool with the wrong arguments. The question transfers the habit; the instruction transfers only the fix.</desc>
  <rect width="800" height="326" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">Ask the question, don&#8217;t give the answer</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">Slower in the meeting. Faster everywhere else, because the engineer who works it out owns it.</text>
  <text x="44" y="84" font-size="9.5" font-weight="700" fill="var(--fig-red, #c0392b)" letter-spacing="0.7">NOT THIS</text>
  <text x="300" y="84" font-size="9.5" font-weight="700" fill="var(--fig-green, #0f6f4f)" letter-spacing="0.7">ASK THIS</text>
  <text x="596" y="84" font-size="9.5" font-weight="700" fill="var(--fig-muted-2, #7a8896)" letter-spacing="0.7">WHAT IT TRANSFERS</text>
  <line x1="24" y1="92" x2="776" y2="92" stroke="var(--fig-rule-2, #cfd8e3)" stroke-width="2"/>
  <rect x="24" y="102" width="752" height="62" rx="9" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="128" font-size="10.5" fill="var(--fig-red, #c0392b)">&#8220;This won&#8217;t scale past</text>
  <text x="44" y="144" font-size="10.5" fill="var(--fig-red, #c0392b)">one region.&#8221;</text>
  <text x="300" y="128" font-size="10.5" fill="var(--fig-green, #0f6f4f)">&#8220;What happens to this when</text>
  <text x="300" y="144" font-size="10.5" fill="var(--fig-green, #0f6f4f)">the second region comes online?&#8221;</text>
  <text x="596" y="128" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">A question they will ask</text>
  <text x="596" y="144" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">of their own next design</text>
  <rect x="24" y="172" width="752" height="62" rx="9" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="198" font-size="10.5" fill="var(--fig-red, #c0392b)">&#8220;You need an approval step</text>
  <text x="44" y="214" font-size="10.5" fill="var(--fig-red, #c0392b)">before that tool can write.&#8221;</text>
  <text x="300" y="198" font-size="10.5" fill="var(--fig-green, #0f6f4f)">&#8220;Walk me through what happens if</text>
  <text x="300" y="214" font-size="10.5" fill="var(--fig-green, #0f6f4f)">the model calls this with bad arguments.&#8221;</text>
  <text x="596" y="198" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">How to reason about</text>
  <text x="596" y="214" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">blast radius, not one fix</text>
  <rect x="24" y="246" width="752" height="44" rx="9" fill="var(--fig-amber-bg, #fdf3e0)" stroke="var(--fig-amber-line, #e8cc9a)"/>
  <text x="44" y="266" font-size="9" fill="var(--fig-amber-ink, #8a5a13)" letter-spacing="0.7">THE LIMIT</text>
  <text x="44" y="282" font-size="11.5" font-weight="600" fill="var(--fig-amber-ink, #8a5a13)">When the engineer is stuck or the clock is real, give the answer &#8212; with the reasoning attached, so the next design doesn&#8217;t need you.</text>
</svg>
