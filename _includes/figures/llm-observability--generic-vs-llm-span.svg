<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 348" role="img" aria-labelledby="generic-vs-llm-span-t1 generic-vs-llm-span-d1" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="generic-vs-llm-span-t1">A generic HTTP span compared with an LLM span</title>
  <desc id="generic-vs-llm-span-d1">A generic span reports status 200 and 1400 milliseconds, which tells you nothing about a refusal. An LLM span reports zero output tokens, a guardrail intervention on a denied topic at high confidence, and 52 milliseconds total, which explains the failure on its own.</desc>
  <rect width="800" height="348" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">The 200 might be a refusal</text>
  <text x="24" y="50" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">An LLM call fits inside normal tracing, then adds the four things that actually explain the outcome.</text>

  <rect x="20" y="66" width="372" height="240" rx="10" fill="var(--fig-panel-2, #f6f8fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="40" y="95" font-size="13.5" font-weight="700" fill="var(--fig-ink, #1f2933)">A generic HTTP span</text>
  <rect x="40" y="110" width="312" height="102" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <g font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="var(--fig-ink-2, #3c4a59)">
    <text x="56" y="133">http.status_code: 200</text>
    <text x="56" y="154">http.response_time_ms: 1400</text>
    <text x="56" y="175">service.name: chat-api</text>
    <text x="56" y="196">span.status: OK</text>
  </g>
  <text x="40" y="238" font-size="11.5" font-weight="700" fill="var(--fig-muted, #5b6b7b)">Verdict: the call succeeded.</text>
  <line x1="40" y1="254" x2="372" y2="254" stroke="var(--fig-rule-3, #e2e8f0)"/>
  <text x="40" y="276" font-size="11" fill="var(--fig-muted, #5b6b7b)">True, and useless.</text>
  <text x="40" y="292" font-size="11" fill="var(--fig-muted, #5b6b7b)">Nobody can see that the user got refused.</text>

  <rect x="408" y="66" width="372" height="240" rx="10" fill="var(--fig-panel-2, #f6f8fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="428" y="95" font-size="13.5" font-weight="700" fill="var(--fig-ink, #1f2933)">An LLM span</text>
  <rect x="428" y="110" width="312" height="102" rx="8" fill="var(--fig-box, #ffffff)" stroke="var(--fig-rule-2, #cfd8e3)"/>
  <g font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="444" y="130" fill="var(--fig-ink-2, #3c4a59)">gen_ai.usage.output_tokens: 0</text>
    <text x="444" y="148" fill="var(--fig-red, #c0392b)">guardrail.input.action: GUARDRAIL_INTERVENED</text>
    <text x="444" y="166" fill="var(--fig-red, #c0392b)">guardrail.input.topic: investment-advice</text>
    <text x="444" y="184" fill="var(--fig-ink-2, #3c4a59)">guardrail.input.confidence: HIGH</text>
    <text x="444" y="202" fill="var(--fig-ink-2, #3c4a59)">llm.total_latency_ms: 52</text>
  </g>
  <text x="428" y="238" font-size="11.5" font-weight="700" fill="var(--fig-red, #c0392b)">Verdict: blocked on input, denied topic.</text>
  <line x1="428" y1="254" x2="760" y2="254" stroke="var(--fig-rule-3, #e2e8f0)"/>
  <text x="428" y="276" font-size="11" fill="var(--fig-muted, #5b6b7b)">Zero output tokens and 52 ms say it never</text>
  <text x="428" y="292" font-size="11" fill="var(--fig-muted, #5b6b7b)">reached the model. No log file required.</text>
</svg>
