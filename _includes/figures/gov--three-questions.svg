<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="gov-three-questions-t gov-three-questions-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="gov-three-questions-t">Three governance questions, each paired with the mechanism that answers it</title>
  <desc id="gov-three-questions-d">What is this allowed to do is answered by an approved catalog and policy that denies anything outside it. What stops it doing the wrong thing is answered by controls an application team cannot skip. Who is accountable and how would we know is answered by named owners, attribution and traces.</desc>
  <rect width="800" height="340" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">A principle without a mechanism is a standards document</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">Each question can be answered by asking people to comply, or by building the platform so compliance is the only path.</text>
  <text x="44" y="84" font-size="9.5" font-weight="700" fill="var(--fig-muted-2, #7a8896)" letter-spacing="0.7">THE QUESTION</text>
  <text x="330" y="84" font-size="9.5" font-weight="700" fill="var(--fig-red, #c0392b)" letter-spacing="0.7">THE WEAK ANSWER</text>
  <text x="556" y="84" font-size="9.5" font-weight="700" fill="var(--fig-green, #0f6f4f)" letter-spacing="0.7">THE MECHANISM</text>
  <line x1="24" y1="92" x2="776" y2="92" stroke="var(--fig-rule-2, #cfd8e3)" stroke-width="2"/>
  <rect x="24" y="102" width="752" height="66" rx="9" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="130" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">What is this</text>
  <text x="44" y="147" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">allowed to do?</text>
  <text x="330" y="130" font-size="10" fill="var(--fig-red, #c0392b)">A policy page listing</text>
  <text x="330" y="146" font-size="10" fill="var(--fig-red, #c0392b)">approved use cases</text>
  <text x="556" y="130" font-size="10" fill="var(--fig-green, #0f6f4f)">An approved catalog, and policy</text>
  <text x="556" y="146" font-size="10" fill="var(--fig-green, #0f6f4f)">that denies anything outside it</text>
  <rect x="24" y="174" width="752" height="66" rx="9" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="202" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">What stops it doing</text>
  <text x="44" y="219" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">the wrong thing?</text>
  <text x="330" y="202" font-size="10" fill="var(--fig-red, #c0392b)">&#8220;All teams must apply</text>
  <text x="330" y="218" font-size="10" fill="var(--fig-red, #c0392b)">guardrails&#8221;</text>
  <text x="556" y="202" font-size="10" fill="var(--fig-green, #0f6f4f)">A control an application team</text>
  <text x="556" y="218" font-size="10" fill="var(--fig-green, #0f6f4f)">cannot skip or switch off</text>
  <rect x="24" y="246" width="752" height="66" rx="9" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="44" y="274" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">Who is accountable,</text>
  <text x="44" y="291" font-size="11.5" font-weight="700" fill="var(--fig-ink, #1f2933)">and how would we know?</text>
  <text x="330" y="274" font-size="10" fill="var(--fig-red, #c0392b)">&#8220;We trained the teams&#8221;</text>
  <text x="556" y="274" font-size="10" fill="var(--fig-green, #0f6f4f)">A named owner, attribution,</text>
  <text x="556" y="290" font-size="10" fill="var(--fig-green, #0f6f4f)">and traces that survive a query</text>
  <text x="400" y="330" font-size="11" fill="var(--fig-muted-2, #7a8896)" text-anchor="middle">Everything in this series is an argument for the right-hand column.</text>
</svg>
