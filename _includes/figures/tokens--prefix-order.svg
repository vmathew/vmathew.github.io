<svg class="fig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="tokens-prefix-t tokens-prefix-d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="tokens-prefix-t">Prompt caching only works on an identical prefix</title>
  <desc id="tokens-prefix-d">Two prompt layouts. In the first, a per-user field sits near the start, so the cacheable prefix is tiny and every call pays full price. In the second, static content (system prompt, tools, examples, reference document) comes first and per-user content last, so most of the prompt is served from cache.</desc>
  <rect width="800" height="300" fill="var(--fig-bg, #ffffff)"/>
  <text x="24" y="28" font-size="17" font-weight="700" fill="var(--fig-ink, #1f2933)">Same tokens, different order, different bill</text>
  <text x="24" y="48" font-size="12.5" fill="var(--fig-muted, #5b6b7b)">The cache matches from the first byte and stops at the first difference. Anything after that is full price.</text>

  <!-- bad layout -->
  <text x="24" y="86" font-size="11" font-weight="700" fill="var(--fig-red, #c0392b)" letter-spacing="0.6">PER-USER CONTENT EARLY</text>
  <rect x="24" y="94" width="60" height="34" rx="6" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="54" y="115" text-anchor="middle" font-size="10" fill="var(--fig-blue-ink, #17315e)">system</text>
  <rect x="84" y="94" width="70" height="34" rx="6" fill="var(--fig-red-bg, #fdeceb)" stroke="var(--fig-red-line, #eab5ae)"/>
  <text x="119" y="115" text-anchor="middle" font-size="10" fill="var(--fig-red, #c0392b)">"Hi Priya"</text>
  <rect x="154" y="94" width="622" height="34" rx="6" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="465" y="115" text-anchor="middle" font-size="10.5" fill="var(--fig-muted, #5b6b7b)">tools · examples · reference document · history · question — all full price, every call</text>
  <line x1="24" y1="136" x2="84" y2="136" stroke="var(--fig-green, #0f6f4f)" stroke-width="3"/>
  <text x="90" y="140" font-size="10" fill="var(--fig-green, #0f6f4f)">cached: ~3%</text>

  <!-- good layout -->
  <text x="24" y="186" font-size="11" font-weight="700" fill="var(--fig-green, #0f6f4f)" letter-spacing="0.6">STATIC FIRST, PER-USER LAST</text>
  <rect x="24" y="194" width="60" height="34" rx="6" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="54" y="215" text-anchor="middle" font-size="10" fill="var(--fig-blue-ink, #17315e)">system</text>
  <rect x="84" y="194" width="110" height="34" rx="6" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="139" y="215" text-anchor="middle" font-size="10" fill="var(--fig-blue-ink, #17315e)">tool schemas</text>
  <rect x="194" y="194" width="100" height="34" rx="6" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="244" y="215" text-anchor="middle" font-size="10" fill="var(--fig-blue-ink, #17315e)">examples</text>
  <rect x="294" y="194" width="300" height="34" rx="6" fill="var(--fig-blue-bg, #e7edfd)" stroke="var(--fig-blue-line, #93b0f5)"/>
  <text x="444" y="215" text-anchor="middle" font-size="10" fill="var(--fig-blue-ink, #17315e)">reference document (the policy manual everyone asks about)</text>
  <rect x="594" y="194" width="20" height="34" fill="var(--fig-panel-4, #eef1f4)"/>
  <text x="604" y="215" text-anchor="middle" font-size="12" fill="var(--fig-muted-2, #7a8896)">|</text>
  <rect x="614" y="194" width="92" height="34" rx="6" fill="var(--fig-panel, #f8f9fa)" stroke="var(--fig-rule, #dde4ec)"/>
  <text x="660" y="215" text-anchor="middle" font-size="10" fill="var(--fig-muted, #5b6b7b)">history</text>
  <rect x="706" y="194" width="70" height="34" rx="6" fill="var(--fig-red-bg, #fdeceb)" stroke="var(--fig-red-line, #eab5ae)"/>
  <text x="741" y="215" text-anchor="middle" font-size="10" fill="var(--fig-red, #c0392b)">"Hi Priya"</text>
  <line x1="24" y1="236" x2="594" y2="236" stroke="var(--fig-green, #0f6f4f)" stroke-width="3"/>
  <text x="600" y="240" font-size="10" fill="var(--fig-green, #0f6f4f)">cached: ~80%</text>
  <text x="604" y="184" text-anchor="middle" font-size="9.5" fill="var(--fig-muted-2, #7a8896)">cache breakpoint</text>

  <text x="24" y="276" font-size="10.5" fill="var(--fig-faint, #98a4b3)">Nothing about the model changed. The only difference is where the first per-user byte appears.</text>
</svg>
